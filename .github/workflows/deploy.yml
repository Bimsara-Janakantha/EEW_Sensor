name: Build Backend

on:
    push:
        branches:
            - main

env:
    REGISTRY: ghcr.io
    IMAGE_NAME: ${{ github.repository }}

jobs:
    Build_Docker_Image:
        runs-on: ubuntu-latest
        permissions:
            contents: write # Required to create a release
            packages: write # Required to push to GitHub Packages

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Generate Tag and Date
              id: vars
              run: |
                  echo "date=$(date +'%Y-%m-%d')" >> $GITHUB_OUTPUT
                  echo "tag=v$(date +'%Y.%m.%d').${{ github.run_number }}" >> $GITHUB_OUTPUT

            - name: Log in to the Container Registry
              uses: docker/login-action@v3
              with:
                  registry: ${{ env.REGISTRY }}
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }} # Automatically provided by GitHub

            - name: Extract Docker metadata
              id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
                  tags: |
                      type=raw,value=${{ steps.vars.outputs.tag }}
                      type=raw,value=latest

            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v3

            # This runs the build off-server using GitHub's free resources
            - name: Build and push Docker image
              uses: docker/build-push-action@v5
              with:
                  context: .
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha
                  cache-to: type=gha,mode=max

            - name: Create GitHub Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh release create "${{ steps.vars.outputs.tag }}" \
                    --title "EEW_Backend (${{ steps.vars.outputs.date }})" \
                    --generate-notes
